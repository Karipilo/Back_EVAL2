name: Build, Push and Deploy Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest .

      - name: Subir imagen Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop backend_proyecto || true
            docker rm backend_proyecto || true

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

            docker run -d \
              --name backend_proyecto \
              -p 3000:3000 \
              -e DB_HOST=10.0.143.151 \
              -e DB_PORT=3306 \
              -e DB_USER=app_user \
              -e DB_PASSWORD=DevOps123! \
              -e DB_NAME=proyecto_db \
              ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest